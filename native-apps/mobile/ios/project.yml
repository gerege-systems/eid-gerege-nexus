# eID Gerege — iOS/iPadOS клиент.
#
# Код нь ширээний аппын БОДИТ ФАЙЛУУДЫГ хуваалцана (`../../desktop/macos/...`):
# сүлжээ, Keychain, төлөв, локализаци, дизайны токенууд хоёр дээр НЭГ эх сурвалж.
# Хуулбарлавал хоёр апп өөр өөр endpoint, өөр өнгө, өөр орчуулгатай болж
# салбарлана — тэр нь мэдэгддэггүй, дараа нь засахад хамгийн үнэтэй нь.
#
# ponytail: SPM багц болгож тусгаарлаагүй — тэр нь бүх төрлийг `public` болгох
# ~3k мөрийн засвар шаардана. Хил хамгаалах шаардлага гарвал тэр үед нүүлгэнэ.
#
# Ширээний-ОНЦЛОГ хэсгүүд энд ОРОХГҮЙ: Core/Token (PKCS#11/APDU), Core/Esign
# (ws://127.0.0.1 гүүр), MenuBar, Sparkle, login item, SecurityGuard.
name: eIDGeregeMN
options:
  bundleIdPrefix: mn.gerege.eid
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"

targets:
  eIDGeregeMN:
    type: application
    platform: iOS
    sources:
      # Энэ аппын өөрийн дэлгэцүүд.
      - path: App
      - path: Features
      - path: Assets.xcassets
      # Ширээний аппаас ХУВААЛЦСАН давхаргууд.
      - path: ../../desktop/macos/App/AppState.swift
      - path: ../../desktop/macos/Core/Network
      - path: ../../desktop/macos/Core/Keychain
      - path: ../../desktop/macos/Design
      - path: ../../desktop/macos/Domain
      - path: ../../desktop/macos/Presentation
      - path: ../../desktop/macos/Infrastructure/Security/Pinning
      # SPKI pin-үүд XOR-оор далдлагдсан тул pinning нь энэ файлыг дуудна.
      # Хажуугийн `SecurityGuard.swift` нь ЗӨВХӨН macOS (anti-debug) тул орохгүй.
      - path: ../../desktop/macos/Infrastructure/Security/Integrity/Obfuscated.swift
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: mn.gerege.eid.ios
        PRODUCT_NAME: eID Gerege
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CQTHTD6YJQ
        CODE_SIGN_ENTITLEMENTS: eIDGeregeMN.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: false
        INFOPLIST_KEY_CFBundleDisplayName: eID Gerege
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.business
        INFOPLIST_KEY_NSFaceIDUsageDescription: eID Gerege session-ийг аюулгүй нээхийн тулд Face ID ашиглана.
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
    info:
      path: eIDGeregeMN-Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: mn.gerege.eid.ios
            CFBundleURLSchemes:
              - gerege-eid
        # eID Mongolia апп руу app-to-app үсрэхийн ӨМНӨ суусан эсэхийг асуухад
        # эдгээр схем ЗААВАЛ энд бүртгэгдсэн байх ёстой — эс бөгөөс
        # `canOpenURL` үргэлж false буцааж, апп «суугаагүй» гэж худал хэлнэ.
        LSApplicationQueriesSchemes:
          - eidmongolia
          - geregesmartid
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

schemes:
  eIDGeregeMN:
    build:
      targets:
        eIDGeregeMN: all
    run:
      config: Debug
    archive:
      config: Release
