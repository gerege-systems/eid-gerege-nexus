# backups.eid.gerege.mn — нөөцлөлтийн журам.
#
# Статик хуудас, өөрийн контейнерээс (deploy/docker-compose.yml, порт 3019).
# Хостод юу ч суулгахгүй: агуулга нь репод, шинэчлэх нь `git pull`.
#
# Хоёр урхи, хоёулаа хариу 200 хэвээр байхад чимээгүй ажилладаг (цөмийн
# docs/OPERATIONS.md):
#
#   1. `add_header` өв залгамжлахгүй — тиймээс бүгд нь server түвшинд, нэг ч
#      location блок дотор байхгүй.
#   2. Certbot HTTP/2 бичдэггүй — тиймээс `http2 on;` тусдаа заавраар.
#
# Суулгах (certbot-оос ӨМНӨ):
#   cp nginx/backups.eid.gerege.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/backups.eid.gerege.mn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d backups.eid.gerege.mn

server {
    listen 80;
    server_name backups.eid.gerege.mn;

    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:3019;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
