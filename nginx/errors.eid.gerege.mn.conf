# errors.eid.gerege.mn — GlitchTip, алдааны хөтлөлт.
#
# Upstream нь deploy/docker-compose.glitchtip.yml-ийн `web` (порт 8000,
# loopback). Backend болон бүрхүүл нь үйл явдлаа энэ домэйнээр биш,
# платформын Docker сүлжээгээр дотогш илгээдэг — энэ хаяг нь ХҮНД зориулсан.
#
# Нээлттэй бүртгэл унтраалттай (`ENABLE_OPEN_USER_REGISTRATION=false`) тул энэ
# домэйн дээр хэн ч данс үүсгэж чадахгүй. Эхний хэрэглэгчийг shell-ээс:
#   docker exec -it gerege_eid_nexus_glitchtip_web ./manage.py createsuperuser
#
# Хоёр урхи, хоёулаа хариу 200 хэвээр байхад чимээгүй ажилладаг (цөмийн
# docs/OPERATIONS.md):
#
#   1. `add_header` өв залгамжлахгүй — тиймээс бүгд нь server түвшинд.
#   2. Certbot HTTP/2 бичдэггүй — тиймээс `http2 on;` тусдаа заавраар.
#
# Суулгах (certbot-оос ӨМНӨ):
#   cp nginx/errors.eid.gerege.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/errors.eid.gerege.mn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d errors.eid.gerege.mn

server {
    listen 80;
    server_name errors.eid.gerege.mn;

    # Stack trace бүхий үйл явдал нь хэдэн зуун килобайт байж болно. Анхдагч
    # 1 МБ-ыг нэрлээгүй орхивол том үйл явдал 413-аар чимээгүй алдагдана.
    client_max_body_size 8m;

    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Үйл явдлын жагсаалтын хуудсууд нь том асуулга ажиллуулдаг.
        proxy_read_timeout 120s;
    }
}
