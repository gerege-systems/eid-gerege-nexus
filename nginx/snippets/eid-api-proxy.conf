# eID Mongolia-гийн вэб backend руу дамжуулах заавруудын багц.
#
# Ширээний клиент нь eID-ийн нийтийн `/api/*` route-уудыг дууддаг
# (`native-apps/desktop/macos/Core/Network/Endpoints.swift`). Тэдгээр нь ЭНЭ
# хостоор дамжина, шууд биш: клиент нэг л гарал мэддэг байх нь webview доторх
# ажлын муж, native дуудлага хоёрыг нэг origin дээр үлдээж, session cookie-г
# `SameSite=Strict` хэвээр ажиллуулна.
#
# Snippet болгосон нь: дор хаяж хоёр location энэ багцыг хэрэглэнэ (утас руу
# push илгээдэг замууд өөр rate limit-тэй), мөн хоёр vhost — платформынх ба
# төхөөрөмжийн шугамынх. Хуулбарлавал нэг өдөр нэг нь ялгаатай болно.
#
#   include snippets/eid-api-proxy.conf;

proxy_pass https://eidmongolia.mn;
proxy_http_version 1.1;

# Upstream нь ӨӨРИЙН нэрээ хүлээж авна — $host дамжуулбал виртуал хост
# таарахгүй. SNI-г мөн тусад нь: түүнгүйгээр TLS хэлэлцээр буруу гэрчилгээ
# дээр буудаг.
proxy_set_header Host eidmongolia.mn;
proxy_ssl_server_name on;
proxy_ssl_name eidmongolia.mn;

# Upstream-ийн гэрчилгээг ШАЛГАНА. Анхдагчаар nginx үүнийг хийдэггүй —
# өөрөөр хэлбэл proxy_pass https:// нь дангаараа «шифрлэгдсэн, гэхдээ хэнтэй
# болох нь мэдэгдэхгүй» гэсэн үг. Иргэний нэвтрэлтийг дамжуулж байгаа зам
# дээр тэр нь хангалтгүй.
proxy_ssl_verify on;
proxy_ssl_verify_depth 3;
proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# `/api/status` нь серверийн барьдаг long poll (~25 сек).
proxy_read_timeout 60s;

# Гарын үсэг зурах PDF нь multipart-аар ирнэ. Анхдагч 1 МБ-ыг нэрлээгүй
# орхивол том баримт 413-аар чимээгүй унана.
client_max_body_size 32m;
