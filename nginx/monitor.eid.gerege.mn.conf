# monitor.eid.gerege.mn — ажиглалтын landing хуудас ба Grafana.
#
# Домэйны үндэс дээр landing хуудас, Grafana нь `/grafana/` дэд зам дээр
# (`GF_SERVER_SERVE_FROM_SUB_PATH`). Хуучин холбоосууд (monitor.eid.gerege.mn/d/…)
# ажиллана: доорх сүүлчийн `location /` тэднийг Grafana руу дамжуулж, Grafana
# өөрөө шинэ зам руу шилжүүлнэ.
#
# Брэндлэлт (нэвтрэх карт, тэмдэг, tab icon, Монгол хэл) нь ЭНЭ ФАЙЛД БАЙХГҮЙ:
# `deploy/scripts/setup_monitor_branding.sh` түүнийг /var/www/monitor руу
# суулгаад доор include хийгдсэн snippet-ийг үүсгэнэ. Хост дээр нэг удаа,
# дараа нь Grafana шинэчлэх бүрд ажиллуулна — chunk-ийн нэрэн дэх hash
# өөрчлөгдөхөд орлуулалт таарахаа больдог.
#
# Хоёр урхи, хоёулаа хариу 200 хэвээр байхад чимээгүй ажилладаг (цөмийн
# docs/OPERATIONS.md, «nginx-ийн хоёр урхи»):
#
#   1. `add_header` өв залгамжлахгүй — хүү блок дотор НЭГ ч байвал дээд
#      түвшнийхийг БҮГДИЙГ нь хаяна. Тиймээс энэ файлын бүх `add_header` нь
#      server түвшинд, location блок дотор нэг ч байхгүй.
#   2. Certbot HTTP/2 бичдэггүй — `listen 443 ssl` мөрийг өөрөө бичээд
#      протоколыг нэмдэггүй. Тиймээс `http2 on;` нь тусдаа заавар.
#
# Суулгах (certbot-оос ӨМНӨ):
#   cp nginx/monitor.eid.gerege.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/monitor.eid.gerege.mn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d monitor.eid.gerege.mn
#   deploy/scripts/setup_monitor_branding.sh

server {
    listen 80;
    server_name monitor.eid.gerege.mn;

    http2 on;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    # nginx-ийн өгөгдмөл нь gzip_proxied off / gzip_types text/html — өөрөөр
    # хэлбэл proxy-оос ирсэн юуг ч дахин шахахгүй. Доорх Grafana-ийн блок нь
    # sub_filter HTML-ийг харж чадахын тулд Accept-Encoding-ийг цэвэрлэдэг;
    # энэ хосгүй бол түүний ард яваа JS багц бүр шахалтгүй гарна.
    gzip_proxied any;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/plain;

    # Ажиглалтын самбар нь хайлтын робот, урьдчилсан харагдац, frame-д
    # зориулагдаагүй.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Домэйныг бичсэн хүн юуны дээр ирснээ уншдаг хуудас.
    location = / {
        root /var/www/monitor;
        try_files /index.html =404;
    }

    location /grafana/ {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300s;

        # Grafana OSS-д брэндлэх цэг байхгүй тул хэв маяг ба скриптийг HTML
        # бүрийн </head>-д энд оруулна. Хоёулаа НЭГ заавраар: nginx дараагийн
        # шүүлтүүрт өмнөх нь орлуулсан текстийг өгдөггүй.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<link rel="stylesheet" href="/grafana-eid.css"><script src="/grafana-eid.js" defer></script></head>';
        sub_filter '<title>Grafana</title>' '<title>Ажиглалт — eID Gerege</title>';
        sub_filter_once on;
    }

    # Хуучин холбоосууд (monitor.eid.gerege.mn/d/…). Grafana тэднийг өөрөө
    # /grafana/… руу шилжүүлнэ — тиймээс энд зөвхөн дамжуулна.
    location / {
        proxy_pass http://127.0.0.1:3009;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /grafana-eid.css { root /var/www/monitor; }
    location = /grafana-eid.js  { root /var/www/monitor; }

    # Браузарын tab дээрх болон утасны дэлгэц дээрх тэмдэг. nginx нь хариуны
    # төрлийг URI дахь өргөтгөлөөс тодорхойлдог болохоос alias-ийн заасан
    # файлаас биш — тиймээс хоосон types блок нь .svg файлыг image/png гэж
    # явуулахаас сэргийлнэ.
    location = /grafana/public/build/img/fav32.png {
        alias /var/www/monitor/grafana-favicon.svg;
        types { } default_type image/svg+xml;
    }
    location = /grafana/public/build/img/apple-touch-icon.png {
        alias /var/www/monitor/grafana-favicon.svg;
        types { } default_type image/svg+xml;
    }

    # deploy/scripts/setup_monitor_branding.sh үүсгэдэг: Grafana-ийн хоёр
    # chunk-ийг (хэлний жагсаалт ба орчуулга) орлуулах хоёр location. Файл
    # байхгүй байсан ч nginx унахгүй — брэндлэлтгүйгээр ажиллана.
    include /etc/nginx/snippets/monitor-grafana-overrides.conf*;
}
