# Төхөөрөмжийн шугамууд — form factor тутамд нэг host, тэдний ард нэг backend.
#
#   desktop.eid.gerege.mn  macOS, Windows ширээний клиент
#   mobile.eid.gerege.mn   iOS / iPadOS, Android
#
# Хаяг нь хүн төхөөрөмжийг ХЭРХЭН БАРЬДГИЙГ нэрлэнэ, үйлдлийн системийг биш:
# ширээн дээрх Mac ба Windows хоёр нэг шугам. Аль клиент ажиллаж байгаа нь
# тусдаа асуулт бөгөөд `window.GeregeShell` түүнд хариулна.
#
# Upstream-ууд нь eid.gerege.mn-ийнхтэй ЯГ ижил: 3008 бүрхүүл, 8082 API.
# Төхөөрөмжийн шугам backend-ийг салгадаггүй — шугам нь клиент бүрт өөрийн
# ГАРАЛ өгөхийн тулд байдаг болохоос өөрийн үйлчилгээ өгөхийн тулд биш.
#
# Шугам бүрийн доор `/api/` үйлчилдэг нь тухтай байдал биш, зохиомжийн гол
# санаа: webview доторх дуудлага same-origin болж, session cookie нь
# SameSite=Strict хэвээр үлдэж, CORS preflight огт үүсэхгүй. Эдгээр /api/
# блокийг хасаад клиентийг eid.gerege.mn руу заавал cookie-гээр баталгаажсан
# бичилт бүр cross-site болно.
#
# `server_name` нь шугамуудыг ил жагсаана, `*.eid.gerege.mn` wildcard биш:
# wildcard нь өөр бүтээгдэхүүн байхаар төлөвлөсөн ирээдүйн дэд домэйныг ч
# залгина.
#
# ДАРААЛАЛ: DNS → энэ файл → certbot → клиентийн доторх хаягийн тогтмол.
# Эсрэг дарааллаар явбал апп байхгүй host руу чиглэж, «server with the
# specified hostname could not be found» гэж унана — цөмийн репод нэг удаа
# яг тэр болсон (native-apps/shared/device_lines.json, §provisioning).
#
# Суулгах (certbot-оос ӨМНӨ):
#   cp nginx/device-lines.eid.gerege.mn.conf /etc/nginx/sites-available/
#   ln -s /etc/nginx/sites-available/device-lines.eid.gerege.mn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d desktop.eid.gerege.mn -d mobile.eid.gerege.mn
#
# Zone-уудын нэр нь eid.gerege.mn.conf-ийнхоос ялгаатай нь санаатай: ижил
# нэртэй хоёр limit_req_zone бол тохиргооны алдаа, мөн нэг төсвийг хөтөч ба
# төхөөрөмжийн шугам хуваалцвал нэг нь нөгөөгөө өлсгөж чадна.
limit_req_zone $binary_remote_addr zone=eid_device_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=eid_device_oauth:10m rate=30r/m;

server {
    listen 80;
    http2 on;
    server_name desktop.eid.gerege.mn mobile.eid.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # Бүрхүүлийн upstream эдгээрийн нэгийг ч тавьдаггүй. Server түвшинд
        # биш энд байгаа нь: тэгвэл API-ийн өөрийн толгойнууд давхардана.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        # Host-ыг хэвээр дамжуулна — бүрхүүл түүнийг уншиж аль шугамыг
        # үйлчилж байгаагаа шийднэ. Нэг нэр рүү бичвэл шугамууд бүгд нэг
        # болж хураагдана.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll нь API 25 секунд нээлттэй барьдаг long poll.
        proxy_read_timeout 90s;
    }

    # OIDC-ийн цэгүүд. `location /` бүгдийг бүрхүүл рүү явуулдаг тул эдгээргүй
    # бол /oauth2/auth нь Next.js-ийн HTML-ээр хариулж, төхөөрөмжийн шугамаас
    # эхэлсэн нэвтрэлт хэзээ ч хүрч ирэхгүй.
    #
    # snippets/eid-oauth.conf-ийг include хийхгүй ил бичсэн нь: тэр snippet
    # хөтчийн vhost-ынх бөгөөд хоёр газраас нэг файлыг include хийх нь
    # эдгээр шугамын rate limit-ийг хөтчийнхтэй холино.
    location /oauth2/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/openid-configuration {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/jwks.json {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/api/v1/auth/(login|eid/login|eid/start|eid/start-id|dan/login)$ {
        limit_req zone=eid_device_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /oauth2/token {
        limit_req zone=eid_device_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
