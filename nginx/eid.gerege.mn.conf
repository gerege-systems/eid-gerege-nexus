# eid.gerege.mn — eID Gerege.
#
# Upstream ports come from deploy/docker-compose.yml and are published on
# loopback only: 3008 frontend, 8082 API. They are the core's defaults because
# this host carries this stack and nothing else.
#
# The block stays scoped to one server_name — never `default_server` or a
# `*.gerege.mn` wildcard. admin.eid.gerege.mn is the neighbour on this box and
# has its own file.
#
# Install this file BEFORE running certbot. Certbot rewrites it in place: it
# adds the `listen 443 ssl` lines plus a second server block that redirects
# port 80 to https. Do not hand-write those — let certbot own them, otherwise
# renewal stops being able to find its anchors.
#
#   cp nginx/eid.gerege.mn.conf /etc/nginx/sites-available/
#   cp nginx/snippets/eid-oauth.conf /etc/nginx/snippets/
#   ln -s /etc/nginx/sites-available/eid.gerege.mn.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx && certbot --nginx -d eid.gerege.mn
# eID-ийн API-г дамжуулах хоёр төсөв. Утас руу push илгээдэг замууд нь
# бусдаасаа тусдаа: нэг хүн QR-аа дахин дахин шинэчилснээс болж өөр хүний
# утсыг дуугаргах төсөв дуусах ёсгүй.
limit_req_zone $binary_remote_addr zone=eid_push:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=eid_api:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=eid_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=eid_oauth:10m rate=30r/m;

server {
    listen 80;

    # HTTP/2. Certbot writes the `listen 443 ssl` line itself and never puts
    # the protocol on it, so this has to be a separate directive — otherwise it
    # disappears at the next renewal and the domain quietly drops to HTTP/1.1.
    http2 on;
    server_name eid.gerege.mn;

    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        # The API sets these on its own responses; the frontend upstream sets
        # none of them, so every screen a person actually looks at was served
        # with no clickjacking defence, no MIME-sniffing defence and no
        # referrer policy. They are set here rather than at server level
        # because nginx would then add a second copy to the API's own — and a
        # duplicated X-Frame-Options is one some browsers discard entirely,
        # which would weaken the header it was meant to add.
        #
        # `always` matters: without it nginx omits them on its own error
        # responses, which are the easiest ones to provoke.
        #
        # Content-Security-Policy is deliberately absent. A policy worth having
        # has to be written against what the Next.js build actually emits;
        # guessing one at the proxy is how a platform ends up with a blank
        # screen nobody can explain.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        proxy_pass http://127.0.0.1:3008;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Ширээний клиентийн татах холбоос.
    #
    # Файл нь GitHub Release дээр байрлана — 79 МБ бинарыг репод хийвэл clone
    # бүрд үүрд татагдах бөгөөд git-ийн түүхээс арилахгүй. Энд зөвхөн ТОГТМОЛ
    # хаяг үлдэж, шинэ хувилбар гарахад доорх URL-ийн шошгыг л солино.
    #
    # https://eid.gerege.mn/download/windows → хамгийн сүүлийн .exe
    location = /download/windows {
        return 302 https://github.com/gerege-systems/eid-gerege-nexus/releases/download/v1.0.9/eID-Gerege-1.0.9-x64.exe;
    }

    # Брэндийн зураг (`BRAND_LOGO_URL`, `BRAND_ICON_URL`,
    # `BRAND_MASKABLE_ICON_URL`). Агуулга нь репод —
    # deploy/brand-assets/, deploy/docker-compose.sites.yml-ийн `brand`
    # контейнерээр. Толгойнууд энд давтагдаж байгаа нь: `add_header` өв
    # залгамжлахгүй тул тэдгээрийг тавьдаг location-оос гадуур байх зам нь
    # тэднийг огт аваагүй хариу болно.
    location /brand/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        # Тэмдэг ховор солигдоно, харин солигдоход нь хуучин зураг сар турш
        # хадгалагдах ёсгүй: нэг цаг нь дахин байрлуулалт болон хүн шинийг
        # харах хоёрын хооронд боломжийн зай.
        add_header Cache-Control "public, max-age=3600" always;
        proxy_pass http://127.0.0.1:3020/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ------------------------------------------------- eID платформын API
    #
    # Замуудыг ил жагсаасан нь санаатай: `/api/` prefix нь ЭНЭ байрлуулалтын
    # backend-ийнх (`/api/v1/...`) бөгөөд түүнийг бүхэлд нь гадагш урсгах нь
    # платформын API-г өөр домэйн руу задлах байв. Доорх хаалттай багц —
    # клиент шинэ зам дуудвал энд нэмэгдэх ёстой, эс бөгөөс 404 болно.
    #
    # regex location нь prefix-ээс ТЭРГҮҮЛНЭ, тиймээс доорх `location /api/`
    # энэ багцыг харахгүй.

    # Иргэний УТАС РУУ мэдэгдэл түлхдэг гурван зам. Эдгээр нь нийтийн домэйн
    # дээр ил байх тул хатуу хязгаартай: РД мэдэх хэн ч дурын хүний утсыг
    # дуугаргаж чадах ёсгүй. eID тал өөрөө ч хязгаартай (60с-д 3) боловч
    # тэр нь РД тус бүрээр — дайрагч РД сольж л байвал бидний IP-гээр
    # хязгааргүй хүсэлт урсана.
    location ~ ^/api/(login-notify|esign-sign|sign-pdf-start)$ {
        limit_req zone=eid_push burst=3 nodelay;
        include snippets/eid-api-proxy.conf;
    }

    location ~ ^/api/(start|status|sign-pdf-download|representations|children|certificates|dashboard|devices|activity|health|child/(code|init|revoke))$ {
        limit_req zone=eid_api burst=40 nodelay;
        include snippets/eid-api-proxy.conf;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /auth/eid/poll is a long poll the API holds open for 25s. The default
        # 60s read timeout covers it, but state it so nobody tightens it blind.
        proxy_read_timeout 90s;
    }

    # These limits live at the shared ingress, so adding API replicas cannot
    # multiply an attacker's password/token budget. The application limiter is
    # retained as a second layer for deployments that bypass this nginx file.
    location ~ ^/api/v1/auth/(login|eid/login|eid/start|eid/start-id|dan/login)$ {
        limit_req zone=eid_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Everything else the OIDC provider serves at the root. Kept in a snippet
    # so an existing server — whose TLS block certbot owns — can be given them
    # by adding one line rather than by being rewritten.
    #
    # The path is nginx's own: this resolves to /etc/nginx/snippets/. Install
    # it alongside this file, from deploy/nginx/snippets/ in this repository:
    #
    #   cp deploy/nginx/snippets/eid-oauth.conf /etc/nginx/snippets/
    #
    # Copying only the vhost leaves nginx -t failing on a missing include, and
    # a server that does start without these routed answers every OIDC
    # discovery request with the frontend's 404 — which is what issue #66 was.
    include snippets/eid-oauth.conf;

    location = /oauth2/token {
        limit_req zone=eid_oauth burst=10 nodelay;
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
