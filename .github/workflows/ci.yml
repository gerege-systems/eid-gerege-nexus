# What has to be true before this repository's main moves.
#
# The build-and-test half is the core's reusable workflow, called rather than
# copied: the App Store's CI was copied by hand once and the copy silently
# arrived without a security scan. A copy diverges the moment it is made.
#
# What stays here is what only this repository has: its image. The core cannot
# build it and no other distribution's Dockerfile is the same file.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    # gofmt, go vet, the race detector, and the rule that the core is pinned by
    # a release tag rather than by a commit.
    uses: gerege-systems/open-gerege-nexus/.github/workflows/distribution-ci.yml@main

  image:
    name: Image
    runs-on: ubuntu-latest
    # The deployable artefact, built exactly as deploy.sh builds it.
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t eid-nexus:ci -f deploy/Dockerfile .
      - name: Хувилбарын тамга буусан эсэх
        # Цөмийн эх кодын анхдагч (1.1.0) үлдвэл `-X` онсонгүй гэсэн үг бөгөөд
        # тэр образ манифестуудаа татгалзаж, огт асахгүй — build log дээр юу ч
        # хэлэхгүй. Тиймээс go.mod-ийн хувилбар binary дотор байгаа эсэхийг
        # энд асууна.
        run: |
          set -euo pipefail
          core=$(grep -oE 'open-gerege-nexus/backend v[^ ]+' go.mod | head -1 | sed 's|.* v||')
          core=${core%%-*}
          docker run --rm --entrypoint sh eid-nexus:ci -c "grep -aqF '$core' /app/eidnexus" \
            || { echo "PlatformVersion $core образ дотор алга — -X флаг оносонгүй"; exit 1; }
