# What has to be true before this repository's main moves.
#
# The core has its own CI; this one is about the half that lives here — the
# modules this repository will carry and the image that ships them. It exists
# from the first commit because the failure a distribution is most exposed to
# is not visible on the laptop that wrote it: go.mod pointing at a working
# copy, or a Dockerfile whose PlatformVersion stamp misses and produces an
# image that builds cleanly and refuses to boot.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # The toolchain comes from go.mod, so it cannot drift from what the
          # code is written against.
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...

  image:
    name: Image
    runs-on: ubuntu-latest
    # The deployable artefact, built exactly as deploy.sh builds it. This is
    # the job that catches an absolute `replace` in go.mod and a core bump that
    # moved PlatformVersion out from under the Dockerfile's `-X`.
    steps:
      - uses: actions/checkout@v7
      - name: docker build
        run: docker build -t eid-nexus:ci -f deploy/Dockerfile .
      - name: Хувилбарын тамга буусан эсэх
        # Цөмийн эх кодын анхдагч (1.1.0) үлдвэл `-X` онсонгүй гэсэн үг бөгөөд
        # тэр образ манифестуудаа татгалзаж, огт асахгүй — build log дээр юу ч
        # хэлэхгүй. Тиймээс go.mod-ийн хувилбар binary дотор байгаа эсэхийг
        # энд асууна.
        run: |
          set -euo pipefail
          core=$(grep -oE 'open-gerege-nexus/backend v[^ ]+' go.mod | head -1 | sed 's|.* v||')
          core=${core%%-*}
          [ -n "$core" ] || { echo "go.mod дотор цөмийн хувилбар олдсонгүй"; exit 1; }
          docker run --rm --entrypoint sh eid-nexus:ci -c "grep -aqF '$core' /app/eidnexus" \
            || { echo "PlatformVersion $core образ дотор алга — -X флаг оносонгүй"; exit 1; }
