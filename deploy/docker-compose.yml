# eID Gerege, as a Gerege Nexus distribution.
#
# Four services: postgres, the platform's migrations, this product's binary,
# and the platform's shell. There is no second migration history here — this
# repository has no schema of its own yet — and no redis: the core runs without
# one and nothing on this host needs a second thing to keep alive.
#
# The observability, error-tracking and off-site-backup stacks are NOT here.
# They are separate compose projects joining this one's network:
#
#   deploy/docker-compose.monitoring.yml   Prometheus, Alertmanager, Loki,
#                                          Tempo, Alloy, Grafana, exporters
#   deploy/docker-compose.glitchtip.yml    error tracking (Sentry protocol)
#   deploy/docker-compose.backups.yml      the off-site object store
#   deploy/docker-compose.sites.yml        the static domains
#
# Separate deliberately, the way the core keeps them: if the whole monitoring
# stack falls over, nothing here notices, and `down` on it is a safe thing to
# do at any hour. Folded in here instead, `deploy.sh` would recreate fifteen
# observability containers on every rollout of the platform — and a missing
# GRAFANA_ADMIN_PASSWORD would stop the platform itself from starting.
#
# Required environment (deploy/.env, copied there by deploy.sh):
#   EID_NEXUS_POSTGRES_PASSWORD  this stack's own database
#   SSO_DEFAULT_CLIENT_SECRET    the platform refuses to start without it in
#                                production — see config.ValidateProduction
#   PUBLIC_ORIGIN                where this instance answers
#   WEB_IMAGE                    the core's published shell, at the commit
#                                go.mod pins
#
# The ports ARE the core's defaults (5434 / 8082 / 3008), and that is a fact
# about this host rather than a convention: this machine carries eid.gerege.mn
# and nothing else. A second stack landing here would have to move, the way
# client.gerege.mn had to on the core's own box.

name: eid-nexus

services:
  postgres:
    image: postgres:16-alpine
    container_name: gerege_eid_nexus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: platform_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EID_NEXUS_POSTGRES_PASSWORD:?EID_NEXUS_POSTGRES_PASSWORD is required}
      TZ: ${TZ:-Asia/Ulaanbaatar}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - gerege_eid_nexus_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: ${IMAGE:-eid-nexus:latest}
    container_name: gerege_eid_nexus_migrate
    # The platform's migrations, from the core version this product's go.mod
    # pins — the image carries both, so they cannot drift apart.
    command: ["/app/migrate", "up"]
    environment:
      DATABASE_URL: postgres://postgres:${EID_NEXUS_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: ${IMAGE:-eid-nexus:latest}
    container_name: gerege_eid_nexus_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://postgres:${EID_NEXUS_POSTGRES_PASSWORD}@postgres:5432/platform_db?sslmode=disable
      ENVIRONMENT: production
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-https://eid.gerege.mn}
      # Хөтчийн гарал, дээр нь төхөөрөмжийн шугамууд. Native клиент бүр
      # өөрийн host дээр сууж, тэр host нь /api/v1-ийг ЭНЭ backend руу
      # дамжуулдаг тул webview доторх дуудлага same-origin хэвээр байна —
      # session cookie нь SameSite=Strict, CORS preflight үүсэхгүй. Энэ мөр
      # нь шугамаас ГАДУУР ирэх дуудлагад (жишээ нь хөгжүүлэлтийн үед)
      # зориулагдсан.
      #
      # Шугамын хаягийг DNS, nginx, TLS бэлэн БОЛОХООС ӨМНӨ клиент рүү
      # бүү заа: апп «server could not be found» гэж унана.
      ALLOWED_ORIGINS: ${PUBLIC_ORIGIN:-https://eid.gerege.mn},${DEVICE_LINE_ORIGINS:-https://desktop.eid.gerege.mn,https://mobile.eid.gerege.mn}
      # nginx terminates TLS in front of this, so the forwarded client address
      # can be trusted — and the login rate limiter counts on it being real.
      TRUST_PROXY_HEADERS: "true"
      # Postgres and the Go process keep the same wall clock. Two different
      # ones and `CURRENT_DATE` and `nexus.Today()` land on different days.
      TZ: ${TZ:-Asia/Ulaanbaatar}
      PLATFORM_TIMEZONE: ${TZ:-Asia/Ulaanbaatar}

      # The catalogue shipped in the image, fetched at build time from the
      # pinned core. File mode: an instance that pulled a catalogue from a
      # registry would be offering whatever that registry says today rather
      # than what this binary can actually run.
      APP_CATALOG_PATH: /app/catalog/apps.json
      APP_CATALOG_URL: ""

      # ------------------------------------------------- its own identity
      #
      # SSO_CLIENT_ISSUER is absent, deliberately: this deployment identifies
      # people itself. SSO_ISSUER is its own origin, so it is a provider for
      # whatever is installed on it, and the citizen's credential is eID
      # Mongolia below.
      SSO_ISSUER: ${PUBLIC_ORIGIN:-https://eid.gerege.mn}
      SSO_DEFAULT_CLIENT_SECRET: ${SSO_DEFAULT_CLIENT_SECRET:?SSO_DEFAULT_CLIENT_SECRET is required}
      # Exact host names, comma separated — a subdomain is not inherited. Left
      # empty the core's built-in default (nexus.gerege.mn) applies and every
      # redirect this installation mints is refused.
      OAUTH_REDIRECT_HOSTS: ${OAUTH_REDIRECT_HOSTS:-}

      # ------------------------------------------------------ eID Mongolia
      #
      # This installation's relying-party registration. Empty and the eID card
      # on the sign-in screen answers "session could not be started" — which on
      # THIS deployment means nobody but a seeded admin can get in at all.
      #
      # The name and the display text are not decoration: the citizen reads
      # exactly those words in their own app before approving. The core's
      # default is "Gerege Nexus".
      #
      # Browser callback нь ${PUBLIC_ORIGIN}/auth/eid/callback. Native аппын
      # custom URI нь доорх exact allowlist-д бүтнээрээ, eID Mongolia дээрх
      # энэ RP-ийн callback_hosts-д scheme (`gerege-eid://`)-ээрээ бүртгэгдэнэ.
      EID_RP_UUID: ${EID_RP_UUID:-}
      EID_RP_SECRET: ${EID_RP_SECRET:-}
      EID_RP_NAME: ${EID_RP_NAME:-eID Gerege}
      EID_DISPLAY_TEXT: ${EID_DISPLAY_TEXT:-eID Gerege-д нэвтрэх}
      EID_BASE_URL: ${EID_BASE_URL:-https://eidmongolia.mn/v3}
      EID_CERT_LEVEL: ${EID_CERT_LEVEL:-ADVANCED}
      EID_MOCK_MODE: ${EID_MOCK_MODE:-false}
      EID_APP_CALLBACKS: ${EID_APP_CALLBACKS:-gerege-eid://auth}

      # Whether somebody eID vouches for who has no account here gets one.
      # public: they do, in their own home. private: only people invited first.
      PLATFORM_ACCESS_MODE: ${PLATFORM_ACCESS_MODE:-public}

      # What this deployment calls itself. The shell below is given the same
      # name: these are halves of one setting, and a stack that renames only
      # one has a sign-in screen and an eID prompt disagreeing about which
      # product somebody is standing in front of.
      BRAND_NAME: ${BRAND_NAME:-}

      # -------------------------------------------------- operator console
      # Empty means this installation has no console at all: /api/platform/v1
      # 404s and so does /cp. Naming: admin.<domain> — core docs/CONTROL_PLANE.md.
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-}

      # Gerege Core registry lookups. Without it the wizard and the
      # organisation screens ask people to type what the register knows.
      GEREGE_CORE_TOKEN: ${GEREGE_CORE_TOKEN:-}

      # ------------------------------------------------------- ажиглалт
      #
      # Хоёулаа хоосон бол ҮНЭХЭЭР унтраалттай: exporter байхгүй, batch
      # боловсруулагч байхгүй, дэвсгэр goroutine байхгүй. Эдгээрийг заасан
      # Tempo, GlitchTip хоёр нь docker-compose.monitoring.yml болон
      # docker-compose.glitchtip.yml дотор, энэ стекийн сүлжээн дээр.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-0.1}
      # Panic-ийн мэдээлэл Sentry протоколоор. Үйл явдал нь хүсэлтийн дугаар,
      # маршрут, тенантыг зөөнө — их бие, cookie, query string, хүний хаягийг
      # ХЭЗЭЭ Ч биш.
      SENTRY_DSN: ${SENTRY_DSN:-}
      RELEASE_VERSION: ${RELEASE_VERSION:-latest}

      # No demo data in production. The seeded account has a published password.
      SEED_DEMO_DATA: "false"
      DEMO_MODE: "false"
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # The platform's own shell, unmodified — the core's published image rather
  # than a build of our own.
  #
  # A distribution does not fork the frontend: the sidebar and every module
  # screen are catalogue-driven, so the generic shell already renders whatever
  # this instance installs. WEB_IMAGE pins the core commit; keep it on the
  # image built from the same commit go.mod names.
  web:
    image: ${WEB_IMAGE:?WEB_IMAGE is required}
    container_name: gerege_eid_nexus_web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Where the shell asks, server-side, what this deployment is. The browser
      # never uses it: it asks its own origin (lib/apiBase.ts). A server has no
      # origin, which is the whole reason this exists.
      API_INTERNAL_URL: http://backend:8080/api/v1
      # The console's hostname, read by app/cp/layout.tsx on the server. Both
      # halves need it and they need the SAME value: the API answers 404 to a
      # /api/platform/v1 request that arrived on any other host, and the shell
      # answers 404 for /cp on any other host. Give it to only one of them and
      # the console's API works while every one of its pages is a 404 — which
      # is exactly how this deployment came up the first time.
      CONTROL_PLANE_HOST: ${CONTROL_PLANE_HOST:-}
      # Read per request — see frontend/lib/brand.ts — so brand is a setting
      # rather than a build.
      BRAND_NAME: ${BRAND_NAME:-}
      BRAND_SHORT_NAME: ${BRAND_SHORT_NAME:-}
      BRAND_DESCRIPTION: ${BRAND_DESCRIPTION:-}
      BRAND_LOGO_URL: ${BRAND_LOGO_URL:-}
      BRAND_THEME_COLOR: ${BRAND_THEME_COLOR:-}
      BRAND_ICON_URL: ${BRAND_ICON_URL:-}
      BRAND_MASKABLE_ICON_URL: ${BRAND_MASKABLE_ICON_URL:-}
      # Хажуугийн цэсний «Гарын авлага». Хоосон бол цөмийн номыг заана —
      # хаашаа ч хүргэхгүй цэснээс ерөнхий ном нь дээр.
      BRAND_DOCS_URL: ${BRAND_DOCS_URL:-}
      # Нэр, лого биш, БИЧВЭР өөрчлөх цэг: brand/copy.json доторх
      # түлхүүрүүд i18n-ийн харгалзах мөрийг дарж бичнэ. Хоосон файл нь
      # хэвийн байдал — ихэнх суулгац нэр, логоороо л ялгагдана.
      BRAND_COPY_FILE: ${BRAND_COPY_FILE:-/brand/copy.json}

      # ------------------------------------------------------ нүүр хуудас
      #
      # Аль хэсгийг ямар дарааллаар зурахыг СУУЛГАЦ шийднэ (цөмийн
      # frontend/lib/landing.ts). Энд eID-ийн дараалал: хаалга → eID юу
      # хийдэг → итгэлцлийн гинж → хажууд нь юу ажиллаж байна → цаана нь
      # ямар платформ байна. `applications` орхигдсон нь санаатай — энэ
      # репо өөрийн модульгүй тул тэр хэсэг цөмийн ганц бүртгэлийн аппыг
      # жагсаах байв.
      LANDING_SECTIONS: ${LANDING_SECTIONS:-hero capabilities trust services architecture platform technology}

      # «Энэ суулгац» хэсгийн картууд. Хаяггүй нь ЗУРАГДАХГҮЙ — тиймээс
      # монитор, dwh, нөөцлөлтөө асаагаагүй суулгац худал зар тавихгүй.
      # Эхнийх нь бидний биш: иргэнийг таних үндэсний дэд бүтэц өөрөө.
      #
      # Анхдагчууд нь ЭНЭ суулгацынх — хаягууд нь nginx/-д аль хэдийн байгаа
      # тул нүүр хуудас .env дээрх гар ажил хүлээхгүй. `admin` нь хаягийн
      # allowlist-ийн цаана (nginx/snippets/eid-cp-allowlist.conf) тул нийтэд
      # зарахгүй: зочны 99 хувьд тэр карт 403 руу хүргэнэ.
      SERVICE_URL_EID: ${SERVICE_URL_EID:-https://eidmongolia.mn}
      SERVICE_URL_ADMIN: ${SERVICE_URL_ADMIN:-}
      SERVICE_URL_DWH: ${SERVICE_URL_DWH:-https://dwh.eid.gerege.mn}
      SERVICE_URL_BACKUPS: ${SERVICE_URL_BACKUPS:-https://backups.eid.gerege.mn}
      SERVICE_URL_MONITOR: ${SERVICE_URL_MONITOR:-https://monitor.eid.gerege.mn}
      SERVICE_URL_DOCS: ${SERVICE_URL_DOCS:-}
      # Рендерийн серверийн өөрийн алдааны мэдээлэл, ажиллах үед уншигдана.
      # Браузарын тал нь NEXT_PUBLIC_SENTRY_DSN бөгөөд образ барих үед
      # багцад шатдаг — тиймээс энд тавигдах боломжгүй.
      SENTRY_DSN: ${FRONTEND_SENTRY_DSN:-}
      ENVIRONMENT: production
      RELEASE_VERSION: ${RELEASE_VERSION:-latest}
    volumes:
      # Зөвхөн уншина. BRAND_COPY_FILE=/brand/copy.json заасан үед л
      # уншигдана; хоосон хавтас нь юуг ч өөрчлөхгүй.
      - ../brand:/brand:ro
    ports:
      - "127.0.0.1:3008:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  gerege_eid_nexus_postgres_data:
